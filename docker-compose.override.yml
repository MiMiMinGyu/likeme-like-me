# ==============================================================================
# dev 전용 오버레이 — `docker compose` 가 자동으로 읽는다 (-f 불필요).
#
#   내부 서비스 포트를 호스트에 노출해 로컬 개발 편의를 준다:
#     db   5433 → DBeaver 등 기존 접속정보 보존 (이미 점유됐다면 .env 의 DB_HOST_PORT 로 변경)
#     api  3000 → 프론트 dev 서버(apps/web/.env.development)·직접 호출·SSE 테스트
#
#   프로덕션(docker-compose.prod.yml)에는 이 매핑이 없다 —
#   EC2 에서는 web(80/443)만 열리고 db·api·embedding 은 compose 네트워크 내부에만 존재.
# ==============================================================================

services:
  db:
    ports:
      - "${DB_HOST_PORT:-5433}:5432"

  api:
    ports:
      - "3000:3000"
