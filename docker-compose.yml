# ==============================================================================
# LikemeLikeMe — 루트 개발/데모 스택 (로드맵 4단계, v2-compose)
#
#   docker compose up --build   →  db + embedding + api 한 번에 기동
#
#   - 시크릿은 루트 .env 에서 주입 (.env.example 복사). 커밋 금지.
#   - api 는 db·embedding 이 healthy 된 뒤에 뜨고, 기동 시 prisma migrate deploy 를
#     스스로 실행한다 (apps/api/docker-entrypoint.sh).
#   - 기존 v1 데이터 볼륨(likeme-like-me-api_postgres_data)에서 이관하려면
#     scripts/migrate-pg-volume.sh 를 먼저 1회 실행 (트러블슈팅 #1 / "루트 compose" 섹션).
# ==============================================================================

name: likemelikeme

services:
  db:
    image: pgvector/pgvector:pg16 # ankane/pgvector 는 deprecated → 유지보수되는 공식 이미지
    container_name: chatbot_db
    environment:
      POSTGRES_DB: chatbot_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    ports:
      - "5433:5432" # 호스트 5433 유지 (기존 DBeaver 등 접속 정보 보존)
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding:
    build: ./apps/embedding
    image: likeme-embedding:latest
    container_name: likeme-embedding
    restart: unless-stopped
    # 포트 미노출 — api 만 내부 네트워크로 접근한다. 디버깅 시 아래 주석 해제.
    # ports:
    #   - "8000:8000"
    # healthcheck 는 이미지(apps/embedding/Dockerfile)에 내장돼 있어 여기선 생략.

  api:
    build: ./apps/api
    image: likeme-api:latest
    container_name: likeme-api
    depends_on:
      db:
        condition: service_healthy
      embedding:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      # compose 네트워크 기준 — 서비스명으로 접속 (호스트 포트 아님)
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:?}@db:5432/chatbot_db
      EMBEDDING_URL: http://embedding:8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET(32자 이상)를 .env 에 설정하세요}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY 를 .env 에 설정하세요}
      # 텔레그램 봇은 선택 — 비우면 봇만 비활성화, 앱은 정상 부팅
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-}
      # 마이그레이션을 entrypoint 에서 돌릴지 (기본 true)
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db_data:
